<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenPosse</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 320px; padding: 14px; }
      header {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 12px;
      }
      .mark {
        width: 19px; height: 19px; border-radius: 6.5px;
        background: linear-gradient(150deg, #0a84ff, #30d158);
        display: grid; place-items: center;
        font-size: 8px; font-weight: 700; color: #fff;
        box-shadow: inset 0 0.5px 0 rgba(255,255,255,.5), 0 1px 3px rgba(0,0,0,.4);
      }
      header .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.008em; }
      header .spacer { flex: 1; }
      .hint { color: var(--text-faint); font-size: 11px; }
      #agents { margin-bottom: 12px; }
      #empty { color: var(--text-dim); font-size: 12.5px; }
      .ask { display: flex; gap: 7px; margin-top: 10px; }
      .ask input { flex: 1; }
      footer {
        margin-top: 14px; padding-top: 11px;
        border-top: 1px solid var(--line);
        display: flex; gap: 8px; align-items: center;
      }
      footer .spacer { flex: 1; }
      a { color: var(--text-dim); font-size: 11.5px; text-decoration: none; }
      a:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <div class="mark">op</div>
      <div class="title">OpenPosse</div>
      <div class="spacer"></div>
      <div class="hint mono" id="shortcut"></div>
    </header>

    <div id="mic-warning" hidden class="dead-mic">NOT HEARING ANYTHING — CHECK INPUT</div>

    <div id="agents"></div>
    <div id="empty" hidden>
      No assistants yet. Open a page with an AI assistant on it, then record it.
    </div>

    <!-- The manual path. Not only a fallback for a dead microphone: it is the whole product
         minus voice, and it is the right answer in a meeting or an open-plan office. -->
    <div class="ask">
      <input type="text" id="prompt" placeholder="Ask Ivan to…" />
      <button id="send">Ask</button>
    </div>

    <footer>
      <button class="secondary" id="record">Record this tab</button>
      <div class="spacer"></div>
      <a href="#" id="settings">Settings</a>
    </footer>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
