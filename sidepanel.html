<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenPosse</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* ── E14's panel, rebuilt to the mockup of 2026-10-01 ──────────────────────────────
       *
       * The first version ported the popup's markup more or less verbatim and it showed: a
       * second header under Chrome's own, a list of full-width rows where the design uses
       * avatars, and the product's primary action styled as a secondary control. This is the
       * orb's own visual language — `design/README.md` — carried onto a surface that has no
       * page behind it.
       *
       * **The mockup is a style reference, not a measurement one.** It is drawn far wider than
       * a side panel, so matching its proportions literally would give a 7px transcript. What
       * carries over is the language: ambient light, avatars not rows, the status line naming
       * who the turn is with in their own colour, an answer in a bubble with its source under
       * it. The numbers are re-derived for a column that reopens at ~360px and may be narrower.
       *
       * **No Liquid Glass**, and now also **no header**. There is nothing behind a side panel
       * to blur, and Chrome already draws `OpenPosse` with the extension's own icon directly
       * above this document — so the port's header repeated both, twenty pixels apart. The only
       * thing in it Chrome does not show is the shortcut, which moves into the panel's body.
       */

      /* The ambient wash, which is doing most of the work the glass used to.
       *
       * Two layers: a warm pool behind the orb, and a very broad lift so the panel does not end
       * in hard black at the edges. Fixed rather than scrolling, so a long answer slides over
       * the light rather than dragging it. It is **not** tinted by the agent's channel — the orb
       * is, and a green sphere on a green field loses the sphere. Warm orange is the brand's own
       * first palette stop, which is what makes the two read as one object lit from behind. */
      body {
        padding: 10px 14px 20px;
        background:
          radial-gradient(74% 38% at 50% 19%, rgba(255, 122, 24, 0.17), transparent 70%),
          radial-gradient(120% 70% at 50% 30%, rgba(255, 122, 24, 0.07), transparent 78%),
          #0c0c0e;
        background-attachment: fixed;
      }

      /* ── The stage ─────────────────────────────────────────────────────────────────────── */

      .orbwrap { position: relative; display: flex; justify-content: center; }
      /* A fraction of the panel, never a fixed 168px: the design's size assumes a 452px card
         floating over a page, and here the container is wherever the user dragged the divider.
         Note the sphere fills about half of its canvas — the rest was reserved for a halo that
         is switched off. On flat black that read as a hole; with the wash behind it, it reads as
         the light the sphere is sitting in, which is why the canvas is not simply cropped. */
      canvas { width: min(196px, 58vw); aspect-ratio: 1; display: block; }
      .orbwrap .dead-mic { position: absolute; bottom: 6px; }

      .transcript {
        margin: -14px 0 0; padding: 0 2px; text-align: center;
        font-size: 17px; line-height: 1.34; letter-spacing: -0.011em;
        text-wrap: pretty; overflow-wrap: anywhere;
      }
      .transcript:empty { display: none; }
      .volatile { color: var(--text-dim); }
      .caret {
        display: inline-block; width: 2px; height: 15px; vertical-align: -2px;
        background: var(--text); opacity: 0.9; margin-left: 1px;
        animation: blink 1.1s steps(2) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .rule { height: 1px; background: rgba(255, 255, 255, 0.09); margin: 20px 0 13px; }

      /* Avatars on the left, who the turn is with on the right. Straight from the design. */
      .band { display: flex; align-items: center; gap: 10px; min-height: 34px; }
      #avatars { display: flex; gap: 7px; }
      .who {
        margin-left: auto; text-align: right; font-size: 12.5px; color: var(--text-dim);
        display: flex; align-items: center; gap: 7px; overflow-wrap: anywhere;
      }
      .who.tinted { color: var(--channel); }
      .who.bad { color: var(--error); }
      .pulse {
        width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: currentColor;
        animation: breathe 1.3s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1); }
      }

      /* `.avatar` itself comes from ui.css so the panel and Settings cannot disagree about it.
         Only the states are here — and only the floor holder is lit, which is the design's rule
         and not decoration: a dimmed row is "not who you are talking to", never "broken". */
      .av {
        opacity: 0.38; cursor: pointer;
        transition: opacity 0.18s ease, box-shadow 0.18s ease;
      }
      .av:hover { opacity: 0.72; }
      /* Nobody holds the floor: everyone is present, nobody is selected. */
      .av.on { opacity: 1; }
      .av.lit {
        opacity: 1;
        box-shadow:
          inset 0 0.5px 0 rgba(255, 255, 255, 0.45),
          0 0 0 1.5px var(--channel),
          0 0 15px color-mix(in srgb, var(--channel) 55%, transparent);
      }
      .av.aimed:not(.lit) { opacity: 0.9; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.35); }
      .av.broken { box-shadow: 0 0 0 1.5px var(--error); }

      .answer { margin-top: 12px; }
      .answer:empty { display: none; }
      .bubble {
        border-radius: 14px; padding: 11px 13px;
        font-size: 14.5px; line-height: 1.47;
        background: rgba(255, 255, 255, 0.055);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.09);
        animation: rise 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        /* Bounded so a long answer cannot push the controls off screen – they stay reachable
           while an agent is still reading it out. */
        max-height: 46vh; overflow-y: auto; overscroll-behavior: contain;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
      /* Inside the bubble, as drawn: it is a property of the answer, not a note beside it. */
      .sub { font-size: 12px; color: var(--text-faint); margin-top: 5px; }

      /* ── The coaching card, during a recording ─────────────────────────────────────────── */

      .coach .step {
        font-size: 9.5px; font-weight: 600;
        letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 10px;
      }
      .coach .say { font-size: 14px; line-height: 1.45; }
      .coach .say.bad { color: var(--error); }
      .coach .list { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
      .coach .row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
      .coach .row .tick { color: var(--green); font-size: 11px; }
      .coach .row .tick.none { color: var(--text-faint); }
      .coach .row .label { color: var(--text-dim); flex: 0 0 82px; }
      .coach .row .kind {
        font-size: 8.5px; font-weight: 600;
        letter-spacing: 0.06em; color: var(--text-faint); align-self: center;
      }
      /* Wraps rather than truncates: these are the recording's whole output, and an ellipsis
         puts the interesting half of a selector out of reach of a screenshot. */
      .coach .row .detail {
        font-size: 11px; line-height: 1.4;
        font-feature-settings: var(--figures);
        color: rgba(255, 255, 255, 0.75); flex: 1 1 auto;
        overflow-wrap: anywhere;
      }
      .coach .row .detail.none { color: var(--text-faint); font-feature-settings: normal; }
      .coach .row .detail.keys {
        font-feature-settings: normal; font-size: 13px; letter-spacing: 0.12em;
      }

      /* ── The desk ──────────────────────────────────────────────────────────────────────── */

      #desk { margin-top: 20px; }
      #empty { color: var(--text-dim); font-size: 12.5px; margin-bottom: 12px; }
      /* An unreadable roster is not an empty one, and they must not read the same. */
      #empty.problem { color: var(--error); }

      .mic-fix {
        display: block; width: 100%; margin-bottom: 12px;
        font: inherit; font-size: 12px; text-align: left; cursor: pointer;
      }

      /* **Listen is the primary control and Ask is not.** The first version had these the other
         way round – a faint outline for the thing the product is *for*, and a filled button for
         the fallback – which said the opposite of what the layout said. */
      #listen { width: 100%; }
      .ask { display: flex; gap: 7px; margin-top: 9px; }
      .ask input { flex: 1; min-width: 0; }

      /* Which site this is and whether we may drive it. The panel's own diagnostic: a popup that
         closes cannot tell you an hour later that access was revoked. */
      .site { margin-top: 14px; font-size: 11.5px; color: var(--text-dim); }
      .site .host { font-feature-settings: var(--figures); overflow-wrap: anywhere; }
      .site button { margin-top: 8px; width: 100%; }

      footer {
        margin-top: 14px; padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      }
      footer .spacer { flex: 1; }
      /* `font-weight: 400` is not tidying: ui.css's `button` sets 600, so without it these two
         read as bold next to the actual buttons they are meant to be quieter than. */
      .quiet {
        color: var(--text-faint); font-size: 11.5px; font-weight: 400; text-decoration: none;
        cursor: pointer; background: none; border: 0; padding: 0; font-family: inherit;
      }
      .quiet:hover { color: var(--text); }
      /* The shortcut, which is the one thing Chrome's own panel header does not show. */
      #shortcut { color: var(--text-faint); }
    </style>
  </head>
  <body>
    <!-- Deliberately not the design's `NOT HEARING ANYTHING – CHECK INPUT` badge. That one is
         for a microphone that is connected and silent and lives on the orb. A permission that
         was never granted needs different words and a different action. -->
    <button id="mic-warning" hidden class="card bad mic-fix"></button>

    <section id="stage">
      <div class="orbwrap">
        <canvas id="orb"></canvas>
        <div class="dead-mic" id="deadmic" hidden>NOT HEARING ANYTHING – CHECK INPUT</div>
      </div>
      <div class="transcript" id="transcript"></div>
      <div class="rule"></div>
      <div class="band">
        <div id="avatars"></div>
        <div class="who" id="who"></div>
      </div>
      <div class="answer" id="answer"></div>
    </section>

    <section class="coach" id="coach" hidden>
      <div class="step" id="coach-step"></div>
      <div class="say" id="coach-say"></div>
      <div class="list" id="coach-list"></div>
    </section>

    <section id="desk">
      <div id="empty" hidden>
        No assistants yet. Open a page with an AI assistant on it, then record it.
      </div>

      <button id="listen">Listen</button>

      <!-- The manual path. Not only a fallback for a dead microphone: it is the whole product
           minus voice, and it is the right answer in a meeting or an open-plan office. -->
      <div class="ask">
        <input type="text" id="prompt" placeholder="Ask an assistant…" />
        <button id="send" class="secondary">Ask</button>
      </div>

      <div class="site">
        <div class="host" id="site-state">reading…</div>
        <button id="grant" class="secondary" hidden></button>
      </div>

      <footer>
        <!-- Disabled until the script has read the tab in front, so there is no window on load
             where it looks pressable and its click handler has no site to act on. -->
        <button class="secondary" id="record" disabled>Record this tab</button>
        <div class="spacer"></div>
        <span class="tech" id="shortcut"></span>
        <!-- A button, not a bare `<a>` with no href: that is unreachable by keyboard, and these
             two sit beside each other so they should behave the same way. -->
        <button class="quiet" id="settings">Settings</button>
        <!-- E14's surface switch. A quiet link rather than a button, because it is scaffolding
             that gets deleted when user testing picks a surface, and it was competing with
             Record for weight. -->
        <button class="quiet" id="surface"></button>
      </footer>
    </section>

    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
