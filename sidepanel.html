<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenPosse</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* ── E14: one surface ──────────────────────────────────────────────────────────────
       *
       * The popup's contents and the orb's six turn states, in one column that does not close
       * when you look away.
       *
       * **No Liquid Glass here, and the reason is structural rather than fashionable.** The orb
       * floats over somebody's page, so a blurred, saturated backdrop is the material doing its
       * job – it is showing you the page underneath. A side panel has nothing behind it. The
       * same treatment would be a photograph of frosted glass over a flat grey, which is the
       * expensive way to look slightly wrong. Flat surfaces, the channel colours, ordinary
       * contrast.
       *
       * **Nothing may assume a width.** Chrome does not persist the panel's width, does not
       * expose an API to set it, reopens at roughly 360px, and lets the *user* choose which
       * side it appears on. So: one column, no fixed dimensions, nothing with a min-width
       * above ~320px, and the orb sized as a fraction of the panel rather than in pixels.
       */

      body { padding: 14px 14px 18px; }

      header {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 12px;
      }
      /* Sizing ships with the artwork in `src/mark.js`, so this only reserves the space before
         the script fills it and the header does not jump on open. */
      #mark { width: 22px; height: 22px; flex: 0 0 22px; }
      header .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.008em; }
      header .spacer { flex: 1; }
      header .hint { color: var(--text-faint); }

      .mic-fix {
        display: block; width: 100%; margin-bottom: 11px;
        font: inherit; font-size: 12px; text-align: left; cursor: pointer;
      }

      /* ── The stage: what a turn looks like ──────────────────────────────────────────── */

      /* It collapses to nothing when idle rather than reserving space for an answer that is
         not coming. A persistent panel holding 200px of blank waiting area is a worse use of
         the screen than the popup it replaces. */
      .stage { display: flex; flex-direction: column; align-items: center; }

      .orbwrap { position: relative; display: flex; justify-content: center; width: 100%; }
      /* A fraction of the panel, not 168px. The design's size assumes a 452px card floating
         over a page; here the container is whatever the user dragged the divider to. */
      canvas { width: min(168px, 46vw); aspect-ratio: 1; display: block; }
      .orbwrap .dead-mic { position: absolute; bottom: 4px; }

      .transcript {
        margin-top: -6px; padding: 0 2px; text-align: center;
        font-size: 16px; line-height: 1.34; letter-spacing: -0.011em;
        text-wrap: pretty; overflow-wrap: anywhere;
      }
      .transcript:empty { display: none; }
      .volatile { color: var(--text-dim); }
      .caret {
        display: inline-block; width: 2px; height: 15px; vertical-align: -2px;
        background: var(--text); opacity: 0.9; margin-left: 1px;
        animation: blink 1.1s steps(2) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .status {
        margin-top: 8px; font-size: 12px; color: var(--text-dim);
        display: flex; align-items: center; gap: 7px;
      }
      .status:empty { display: none; }
      .status.tinted { color: var(--channel); }
      .status.bad { color: var(--error); }
      .pulse {
        width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: currentColor;
        animation: breathe 1.3s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1); }
      }

      .answer { width: 100%; margin-top: 11px; }
      .answer:empty { display: none; }
      .bubble {
        border-radius: 12px; padding: 10px 12px;
        font-size: 14px; line-height: 1.47;
        background: rgba(255, 255, 255, 0.075);
        box-shadow: inset 0 0 0 0.5px var(--glass-edge);
        animation: rise 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        /* Bounded so a long answer cannot push the roster and the text box off screen – the
           controls stay reachable while an answer is being read out. */
        max-height: 42vh; overflow-y: auto; overscroll-behavior: contain;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
      .sub { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; }

      /* ── The coaching card, during a recording ──────────────────────────────────────── */

      .coach { padding-top: 2px; }
      .coach .step {
        font-size: 9.5px; font-weight: 600;
        letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 10px;
      }
      .coach .say { font-size: 14px; line-height: 1.45; }
      .coach .say.bad { color: var(--error); }
      .coach .list { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
      .coach .row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
      .coach .row .tick { color: var(--green); font-size: 11px; }
      .coach .row .tick.none { color: var(--text-faint); }
      .coach .row .label { color: var(--text-dim); flex: 0 0 82px; }
      .coach .row .kind {
        font-size: 8.5px; font-weight: 600;
        letter-spacing: 0.06em; color: var(--text-faint); align-self: center;
      }
      /* Wraps rather than truncates: these are the recording's whole output, and an ellipsis
         puts the interesting half of a selector out of reach of a screenshot. */
      .coach .row .detail {
        font-size: 11px; line-height: 1.4;
        font-feature-settings: var(--figures);
        color: rgba(255, 255, 255, 0.75); flex: 1 1 auto;
        overflow-wrap: anywhere;
      }
      .coach .row .detail.none { color: var(--text-faint); font-feature-settings: normal; }
      /* A shortcut is something you pressed, not page structure, so it is not a code chip. */
      .coach .row .detail.keys {
        font-feature-settings: normal; font-size: 13px; letter-spacing: 0.12em;
      }

      /* ── The desk: everything transactional ─────────────────────────────────────────── */

      .rule { height: 1px; background: var(--line); margin: 14px 0 12px; }
      #agents { margin-bottom: 10px; }
      #empty { color: var(--text-dim); font-size: 12.5px; margin-bottom: 10px; }
      /* An unreadable roster is not an empty one, and they must not read the same. */
      #empty.problem { color: var(--error); }
      /* A row is a target for the text box, so it has to look like one. */
      .agent { cursor: pointer; border-radius: 8px; padding: 7px 6px; margin: 0 -6px; }
      .agent:hover { background: rgba(255, 255, 255, 0.05); }
      .agent .text { min-width: 0; }
      .agent .name, .agent .kind { overflow-wrap: anywhere; }
      .agent.aimed { background: rgba(255, 255, 255, 0.07); }

      .listen { display: flex; }
      .listen button { flex: 1; }
      .ask { display: flex; gap: 7px; margin-top: 9px; }
      .ask input { flex: 1; min-width: 0; }

      /* Site access. The panel's one irreplaceable job, and the diagnostic the popup could
         never offer because it closed: which site this is and whether we may drive it. */
      .site { margin-top: 13px; font-size: 11.5px; color: var(--text-dim); }
      .site .host { font-feature-settings: var(--figures); overflow-wrap: anywhere; }
      .site button { margin-top: 7px; width: 100%; }

      footer {
        margin-top: 13px; padding-top: 11px;
        border-top: 1px solid var(--line);
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      }
      footer .spacer { flex: 1; }
      a { color: var(--text-dim); font-size: 11.5px; text-decoration: none; cursor: pointer; }
      a:hover { color: var(--text); }
      #surface { margin-top: 9px; width: 100%; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <header>
      <div id="mark"></div>
      <div class="title">OpenPosse</div>
      <div class="spacer"></div>
      <div class="hint tech" id="shortcut"></div>
    </header>

    <!-- Deliberately not the design's `NOT HEARING ANYTHING – CHECK INPUT` badge. That one is
         for a microphone that is connected and silent and lives on the stage below. A
         permission that was never granted needs different words and a different action. -->
    <button id="mic-warning" hidden class="card bad mic-fix"></button>

    <section class="stage" id="stage">
      <div class="orbwrap">
        <canvas id="orb"></canvas>
        <div class="dead-mic" id="deadmic" hidden>NOT HEARING ANYTHING – CHECK INPUT</div>
      </div>
      <div class="transcript" id="transcript"></div>
      <div class="status" id="status"></div>
      <div class="answer" id="answer"></div>
    </section>

    <section class="coach" id="coach" hidden>
      <div class="step" id="coach-step"></div>
      <div class="say" id="coach-say"></div>
      <div class="list" id="coach-list"></div>
    </section>

    <section class="desk" id="desk">
      <div class="rule"></div>

      <div id="agents"></div>
      <div id="empty" hidden>
        No assistants yet. Open a page with an AI assistant on it, then record it.
      </div>

      <div class="listen">
        <button id="listen" class="secondary">Listen</button>
      </div>

      <!-- The manual path. Not only a fallback for a dead microphone: it is the whole product
           minus voice, and it is the right answer in a meeting or an open-plan office. -->
      <div class="ask">
        <!-- Neutral until a roster exists. The popup hardcoded "Ask Ivan to…", which names an
             agent nobody has on a first run – the script overwrites it the moment there is a
             real name to use. -->
        <input type="text" id="prompt" placeholder="Ask an assistant…" />
        <button id="send">Ask</button>
      </div>

      <div class="site">
        <div class="host" id="site-state">reading…</div>
        <button id="grant" class="secondary" hidden></button>
      </div>

      <footer>
        <!-- Disabled until the script has read the tab in front. Otherwise there is a window on
             load where it looks pressable and its click handler has no site to act on. -->
        <button class="secondary" id="record" disabled>Record this tab</button>
        <div class="spacer"></div>
        <a id="settings">Settings</a>
      </footer>

      <!-- E14's surface switch, and it is temporary: it goes when user testing picks a surface
           and the other one is deleted. -->
      <button id="surface" class="secondary"></button>
    </section>

    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
