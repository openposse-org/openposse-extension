<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenPosse</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      /* ── E14's panel, rebuilt to the mockup of 2026-10-01 ──────────────────────────────
       *
       * The first version ported the popup's markup more or less verbatim and it showed: a
       * second header under Chrome's own, a list of full-width rows where the design uses
       * avatars, and the product's primary action styled as a secondary control. This is the
       * orb's own visual language – `design/README.md` – carried onto a surface that has no
       * page behind it.
       *
       * **The mockup is a style reference, not a measurement one.** It is drawn far wider than
       * a side panel, so matching its proportions literally would give a 7px transcript. What
       * carries over is the language: ambient light, avatars not rows, the status line naming
       * who the turn is with in their own colour, an answer in a bubble with its source under
       * it. The numbers are re-derived for a column that reopens at ~360px and may be narrower.
       *
       * **No Liquid Glass**, and now also **no header**. There is nothing behind a side panel
       * to blur, and Chrome already draws `OpenPosse` with the extension's own icon directly
       * above this document – so the port's header repeated both, twenty pixels apart. The only
       * thing in it Chrome does not show is the shortcut, which moves into the panel's body.
       */

      /* The ambient wash, which is doing most of the work the glass used to.
       *
       * **The colour ramp is the landing hero's, not a second guess at it.** Orange at the core,
       * falling through `rgba(228,73,122,.05)` to nothing on `#0B0A0C` – the same ramp the hero
       * puts behind its logo, so the site and the extension are lit by one light. The first
       * version used orange twice and read flatter for it: magenta is what makes the falloff
       * look like distance rather than like the gradient running out.
       *
       * The *geometry* is re-derived rather than ported. The hero's ellipse sits at `74% 50%`
       * because its orb is in the right column of a two-column header; here the orb is centred
       * near the top of a column that reopens at ~360px. Two layers, because the hero's single
       * ellipse leaves the bottom of a tall narrow panel dead.
       *
       * Fixed rather than scrolling, so a long answer slides over the light rather than dragging
       * it. It is **not** tinted by the agent's channel – the orb is, and a green sphere on a
       * green field loses the sphere.
       *
       * Exactly the window's height, in three bands: the turn fixed at the top – orb, question,
       * answer and status – the controls fixed at the foot, and the roster between them as the
       * only part that scrolls. Each band carries its own padding. */
      body {
        display: flex; flex-direction: column; height: 100vh;
        background:
          radial-gradient(86% 42% at 50% 20%,
            rgba(255, 122, 24, 0.17), rgba(228, 73, 122, 0.05) 55%, transparent 75%),
          radial-gradient(130% 72% at 50% 30%, rgba(255, 122, 24, 0.06), transparent 78%),
          #0b0a0c;
        background-attachment: fixed;
      }

      /* The turn stays in view however far the roster has scrolled: the orb, what was said, the
         answer and who it is with. A column whose one give is the answer – see `.answer` – so a long
         one scrolls inside its bubble rather than pushing the roster and the controls off the panel.
         `min-height: 0` is what lets it give at all; a flex item otherwise refuses to be shorter
         than its content. */
      .top {
        flex: 0 1 auto; min-height: 0;
        display: flex; flex-direction: column; padding: 10px 14px 0;
      }
      /* Everything but the answer keeps its height. The question sets a `min-height`, which
         replaces the content-sized minimum, so a long answer could otherwise squeeze a three-line
         question below its text and into the answer. */
      .top > :not(.answer) { flex-shrink: 0; }

      /* The only part that scrolls: the roster. It takes whatever the top and the controls leave,
         but never less than a row of avatars and most of the next – so when an answer is long it is
         the answer that scrolls, and the roster is still there.

         **Its top 10px fade out**, so avatars scrolling up go under the divider softly instead of
         being cut in half against it. At rest that strip is padding, so nothing is faded until it
         scrolls. */
      main {
        flex: 1 1 0; min-height: 76px; overflow-y: auto;
        padding: 14px 14px 20px;
        mask-image: linear-gradient(transparent, #000 10px);
      }

      /* ── The stage ─────────────────────────────────────────────────────────────────────── */

      .orbwrap { position: relative; display: flex; justify-content: center; }
      /* **The hero's proportion, not its pixel count.** It draws the orb at 320px inside a 520px
         column, so the rule is 62% of whatever column it is in, capped where the hero caps it.
         Writing `320px` literally would fill a 360px panel edge to edge, which is a different
         picture from the one being matched.
         Note the sphere fills about half of its canvas – the rest was reserved for a halo that
         is switched off. On flat black that read as a hole; with the wash behind it, it reads as
         the light the sphere is sitting in, which is why the canvas is not simply cropped. */
      canvas { width: min(320px, 62%); aspect-ratio: 1; display: block; }
      .orbwrap .dead-mic { position: absolute; bottom: 6px; }
      /* The demo's play button, top right. Laid over the stage rather than given a row of its own,
         so the top keeps one height; at any panel width it clears the canvas, which is 62% of the
         column and centred. */
      .orbwrap .demo { position: absolute; top: 0; right: 0; }

      /* 21px/500, which is four points larger than the port guessed at. What the transcript is,
         on either surface, is the thing you just said being read back – so it is the one piece of
         text that has to carry from across a desk.

         **Two lines' height, whatever was said**, so the top never changes size between turns or
         while somebody is mid-sentence. A question too long for two lines at 21px steps down to
         18px, then to 16px, where three fit – `fitQuestion` in sidepanel.js measures. Past that
         it is cut: from the front while somebody is still talking, so the words being heard stay
         in view (`.tail`), and at the end with an ellipsis once it has settled (`.clamped`).

         The negative margin lays it over the canvas's lowest 20px, which the sphere never reaches. */
      .transcript {
        height: 66px; overflow: hidden; margin: -20px 0 0; padding: 0 6px; text-align: center;
        font-weight: 500; font-size: 21px; line-height: 1.34; letter-spacing: -0.015em;
        text-wrap: pretty; overflow-wrap: anywhere;
      }
      .transcript.tail { mask-image: linear-gradient(transparent, #000 10px); }
      .transcript.clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
      /* Dimmer than `--text-dim`, deliberately: this is the tail the recogniser is still
         revising, and it has to read as less settled than ordinary secondary text rather than
         the same as it. */
      .volatile { color: rgba(235, 235, 245, 0.52); }
      .caret {
        display: inline-block; width: 2px; height: 1.05em; vertical-align: -0.14em;
        background: var(--text); opacity: 0.9; margin-left: 2px;
        animation: blink 1.1s steps(2) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      /* Who the turn is with, heading the answer box in its top-left corner. It was a line of its
         own under the box, behind a divider, so one exchange was read in two places; inside, the
         status and the answer it is about read as one thing. Until there is a status it holds a
         placeholder, like the answer under it, so the box never reads as empty. */
      .who {
        flex: none; min-height: 18px; margin-bottom: 6px;
        font-size: 13px; line-height: 18px; color: var(--text-dim);
        display: flex; align-items: center; gap: 7px; overflow-wrap: anywhere;
      }
      .who.placeholder { color: var(--text-faint); }
      /* Wraps, because a long roster otherwise runs off the panel and the whole page scrolls
         sideways. Which way each avatar's label hangs then depends on where it landed – see
         `alignTips` in sidepanel.js. 8px rather than 9 puts eight to a row in a 360px panel, which
         9 missed by three pixels. */
      #avatars { display: flex; flex-wrap: wrap; gap: 8px; }
      .who.tinted { color: var(--channel); }
      .who.bad { color: var(--error); }
      .pulse {
        width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: currentColor;
        animation: breathe 1.3s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1); }
      }

      /* `.avatar` itself comes from ui.css so the panel and Settings cannot disagree about it.
         Only the states are here – and only the floor holder is lit, which is the design's rule
         and not decoration: a dimmed avatar is "not who you are talking to", never "broken".

         **Every ring is drawn on the face's `::after` at `inset: -4px`, the hero's geometry.** It
         puts the ring 4px clear of the circle instead of hugging it, and the gap is what makes it
         read as a halo rather than as a border the avatar grew. It also keeps the ring off the
         avatar's own `box-shadow`, so ui.css owns the circle's inner highlight and nothing here
         has to restate it to avoid wiping it out – which is exactly what `.lit` used to do.

         Dimming is the hero's rule too, and it is the inverse of the port's: full opacity is the
         resting state and `dim` is applied to the others only while somebody holds the floor. The
         old version dimmed by default and had to add an `on` class to undo it, so the roster's
         ordinary appearance was the special case.

         **The avatar is a button holding the circle**, which is `.face`. The states stay on the
         button and the dim and the ring are drawn on the face, because the button carries the
         hover label – and an opacity on the button would fade its label along with it. */
      button.av {
        position: relative; display: block; padding: 0;
        background: none; border-radius: 50%;
      }
      button.av:focus-visible { outline: 2px solid var(--blue); outline-offset: 6px; }
      .av .face { position: relative; transition: opacity 0.3s ease; }
      .av .face::after {
        content: ''; position: absolute; inset: -4px; border-radius: 50%;
        box-shadow: 0 0 0 0 transparent; transition: box-shadow 0.3s ease;
        pointer-events: none;
      }
      /* Somebody else holds the floor. */
      .av.dim .face { opacity: 0.42; }
      .av.dim:hover .face { opacity: 0.72; }
      .av.lit .face::after {
        box-shadow:
          0 0 0 1.5px var(--channel),
          0 0 14px color-mix(in srgb, var(--channel) 55%, transparent);
      }
      .av.aimed:not(.lit) .face::after { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.35); }
      .av.broken .face::after { box-shadow: 0 0 0 1.5px var(--error); }

      /* **One height, whatever is in it**: the status line and three lines of answer, which is
         two ordinary sentences at the panel's usual width. So the roster below never moves
         between a short answer, a long one and none yet – an answer lands mid-turn, at the
         moment somebody may be reaching for an avatar. A longer one steps its type down to fit
         more (`fitAnswer` in sidepanel.js), then scrolls inside.

         **Always there**, holding a placeholder in both lines until the first turn, so nothing in
         the top moves at all. It replaces the reserve that used to hold the space from `routing`
         on: a box that is always this tall has nothing left to reserve.

         **Still the give in the top's column.** On a panel too short for all of it, the box
         shrinks below that height rather than pushing the roster off, and the answer scrolls in
         what is left.

         **The divider under it is an inset hairline at the foot of this column** rather than an
         element of its own. A half-pixel `inset` shadow is what the hero uses and the better
         primitive: a 1px div rounds up to a whole device pixel and reads as a drawn line, where
         this catches the light the way the edge of a raised surface does. */
      .answer {
        padding: 14px 0 18px; min-height: 0; display: flex; flex-direction: column;
        box-shadow: inset 0 -0.5px 0 rgba(255, 255, 255, 0.14);
      }
      .bubble {
        --answer-lines: 3;
        /* 24px of padding and 24px of status line, then the lines, in the bubble's own `em`. */
        height: calc(48px + var(--answer-lines) * 1.47em); min-height: 0;
        display: flex; flex-direction: column; overflow: hidden;
        border-radius: 16px; padding: 12px 15px;
        font-size: 15.5px; line-height: 1.47;
        background: rgba(255, 255, 255, 0.075);
        /* Two insets, not one. The hairline alone drew an outlined box; the top highlight is
           what tips it into reading as a raised surface catching the wash behind it. */
        box-shadow:
          inset 0 0.5px 0 rgba(255, 255, 255, 0.22),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.1);
        animation: rise 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* The only part of the box that scrolls. A scroller is also exempt from a flex item's
         content-sized minimum, which is what lets it shrink at all. It rises in when an answer
         lands, as the whole bubble used to. */
      .bubble .text {
        min-height: 0; overflow-y: auto; overscroll-behavior: contain;
        animation: rise 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .bubble .text.placeholder { color: var(--text-faint); }
      @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
      /* Inside the bubble, as drawn: it is a property of the answer, not a note beside it. Under
         the scroller rather than in it, so a note about a long answer – "Shortened" is one – is
         never scrolled out of sight by that answer. */
      .sub { flex: none; font-size: 12.5px; color: rgba(235, 235, 245, 0.55); margin-top: 4px; }

      /* ── The coaching card, during a recording ─────────────────────────────────────────── */

      .coach .step {
        font-size: 9.5px; font-weight: 600;
        letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 10px;
      }
      .coach .say { font-size: 14px; line-height: 1.45; }
      .coach .say.bad { color: var(--error); }
      .coach .list { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
      .coach .row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
      .coach .row .tick { color: var(--green); font-size: 11px; }
      .coach .row .tick.none { color: var(--text-faint); }
      .coach .row .label { color: var(--text-dim); flex: 0 0 82px; }
      .coach .row .kind {
        font-size: 8.5px; font-weight: 600;
        letter-spacing: 0.06em; color: var(--text-faint); align-self: center;
      }
      /* Wraps rather than truncates: these are the recording's whole output, and an ellipsis
         puts the interesting half of a selector out of reach of a screenshot. */
      .coach .row .detail {
        font-size: 11px; line-height: 1.4;
        font-feature-settings: var(--figures);
        color: rgba(255, 255, 255, 0.75); flex: 1 1 auto;
        overflow-wrap: anywhere;
      }
      .coach .row .detail.none { color: var(--text-faint); font-feature-settings: normal; }
      .coach .row .detail.keys {
        font-feature-settings: normal; font-size: 13px; letter-spacing: 0.12em;
      }

      /* ── The desk ──────────────────────────────────────────────────────────────────────── */

      #desk { margin-top: 20px; }
      #empty { color: var(--text-dim); font-size: 12.5px; margin-bottom: 12px; }
      /* An unreadable roster is not an empty one, and they must not read the same. */
      #empty.problem { color: var(--error); }

      .mic-fix {
        display: block; width: 100%; margin-bottom: 12px;
        font: inherit; font-size: 12px; text-align: left; cursor: pointer;
      }

      /* ── Icon buttons ──────────────────────────────────────────────────────────────────── */

      /* **Every control is an icon, and its name is its `aria-label`.** The hover label below
         draws that same attribute, so what a screen reader says and what appears on hover are
         one string and cannot disagree. A control with no label shows no empty pill.

         Full white on a filled, lit ring. At 60% white inside a 10% ring the whole row read as
         switched off. */
      button.icon {
        position: relative;
        width: 34px; height: 34px; flex: 0 0 34px; padding: 0;
        display: grid; place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07); color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
        transition: color 0.15s ease, background-color 0.15s ease;
      }
      button.icon:hover:not(:disabled), button.icon:is([aria-expanded="true"], [aria-pressed="true"]) {
        color: var(--text); background: rgba(255, 255, 255, 0.15);
      }
      button.icon:is([aria-expanded="true"], [aria-pressed="true"]) {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.42);
      }
      button.icon:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
      /* Dimmed by colour, not by ui.css's `opacity`, which would fade the label with the icon –
         and on Record the label is where the reason it is disabled is written. */
      button.icon:disabled {
        opacity: 1; color: var(--text-faint); background: transparent;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      button.icon.busy svg { animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* The label, on hover and on keyboard focus. Not `title`: Chrome waits about a second to
         show one and draws it in the OS's own small type, which is the opposite of "clear".
         The short delay keeps a pointer crossing the row from flashing every label in turn.
         `data-tip-at` pins it to one edge for the controls near the panel's sides, where a
         centred label would run off a 320px column.

         The avatars share it, so every circle in the panel answers a hover the same way. */
      button:is(.icon, .av)[aria-label]::after {
        content: attr(aria-label);
        position: absolute; bottom: calc(100% + 8px); left: 50%; z-index: 5;
        transform: translateX(-50%);
        width: max-content; max-width: 220px;
        padding: 5px 9px; border-radius: 7px;
        background: var(--raised); color: var(--text);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.14), 0 6px 18px rgba(0, 0, 0, 0.5);
        font-size: 11.5px; font-weight: 500; line-height: 1.35; text-align: left;
        pointer-events: none; opacity: 0;
        transition: opacity 0.12s ease;
      }
      button:is(.icon, .av)[aria-label]:is(:hover, :focus-visible)::after {
        opacity: 1; transition-delay: 0.15s;
      }
      button:is(.icon, .av)[data-tip-at="start"]::after { left: 0; transform: none; }
      button:is(.icon, .av)[data-tip-at="end"]::after { left: auto; right: 0; transform: none; }
      /* Below instead, for a control too close to the top of the scrolling middle for its label to
         fit above – `placeTip` in sidepanel.js decides. */
      button:is(.icon, .av)[data-tip-below]::after { bottom: auto; top: calc(100% + 8px); }

      /* ── The controls ──────────────────────────────────────────────────────────────────── */

      /* The microphone centred, two controls either side. A three-column grid rather than flex
         with a spacer, so the microphone stays on the panel's centre line – under the orb – however
         wide either side is. */
      .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
      .controls .side { display: flex; gap: 8px; align-items: center; height: 50px; }
      .controls .side.end { justify-content: flex-end; }
      .controls .center { display: flex; flex-direction: column; align-items: center; gap: 5px; }

      /* **Listen is the one filled control**, and with every button an icon that is the only
         thing left to say it is primary. The first version had Listen as a faint outline and the
         fallback filled, which said the opposite of what the layout said. */
      button.icon.mic {
        width: 50px; height: 50px; flex-basis: 50px;
        background: var(--blue); color: #fff;
        box-shadow:
          inset 0 0.5px 0 rgba(255, 255, 255, 0.35),
          0 6px 22px color-mix(in srgb, var(--blue) 36%, transparent);
      }
      button.icon.mic:hover:not(:disabled) { background: color-mix(in srgb, var(--blue) 86%, #fff); }
      /* While listening it is Stop, which is a different act, so it stops looking like Listen. */
      button.icon.mic.listening {
        background: rgba(255, 255, 255, 0.08); color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      }
      button.icon.mic.listening:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }

      /* The shortcut, which is the one thing Chrome's own panel header does not show. Under the
         microphone, because it is the other way to press it. */
      #shortcut { color: var(--text-faint); }

      /* The manual path, behind the keyboard toggle, just above the controls. */
      .ask { display: flex; gap: 7px; align-items: center; margin-bottom: 12px; }
      .ask input { flex: 1; min-width: 0; }

      /* ── The dock ──────────────────────────────────────────────────────────────────────── */

      /* The controls, fixed at the foot of the panel so Listen is never scrolled away. In the flow
         of the column rather than `fixed`, so the middle ends where the dock begins with no guessed
         padding – the text box and an error line can both grow it. */
      .dock {
        flex: none; padding: 10px 14px 12px;
        box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.14);
      }
      /* What went wrong with the last Grant or Record, beside the buttons that were pressed. */
      .dock .note {
        margin-bottom: 8px; font-size: 11.5px; line-height: 1.4;
        color: var(--error); overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <!-- The turn, fixed at the top. -->
    <header class="top" id="top">
      <!-- Deliberately not the design's `NOT HEARING ANYTHING – CHECK INPUT` badge. That one is
           for a microphone that is connected and silent and lives on the orb. A permission that
           was never granted needs different words and a different action.

           **The one button that is not an icon**, because it is a sentence you need to read
           rather than a control you need to find. Up here with the orb, so it cannot be scrolled
           out of view. -->
      <button id="mic-warning" hidden class="card bad mic-fix"></button>
      <div class="orbwrap">
        <canvas id="orb"></canvas>
        <div class="dead-mic" id="deadmic" hidden>NOT HEARING ANYTHING – CHECK INPUT</div>
        <!-- A scripted turn, for judging this surface and the voice without spending a vendor
             query. Scaffolding – see `demo.js`. -->
        <button class="icon demo" id="demo" data-tip-at="end" data-tip-below></button>
      </div>
      <div class="transcript" id="transcript"></div>
      <!-- The answer under the question it answers, and the roster below both: a long roster
           between the two put five rows of avatars in the middle of one exchange. Who the turn is
           with heads the box, and a note on the answer sits under it. -->
      <div class="answer" id="answer">
        <div class="bubble">
          <div class="who" id="who"></div>
          <div class="text" id="answer-text"></div>
          <div class="sub" id="answer-sub" hidden></div>
        </div>
      </div>
    </header>

    <!-- The only part that scrolls. -->
    <main id="middle">
      <div id="avatars"></div>

      <section class="coach" id="coach" hidden>
        <div class="step" id="coach-step"></div>
        <div class="say" id="coach-say"></div>
        <div class="list" id="coach-list"></div>
      </section>

      <section id="desk">
        <div id="empty" hidden>
          No assistants yet. Open a page with an AI assistant on it, then record it.
        </div>

      </section>
    </main>

    <!-- The controls, fixed at the foot. -->
    <footer class="dock" id="dock">
      <div class="note" id="dock-note" hidden></div>

      <!-- The manual path. Not only a fallback for a dead microphone: it is the whole product
           minus voice, and it is the right answer in a meeting or an open-plan office. Behind
           a toggle because most turns are spoken, and an open empty field reads as the place to
           start. -->
      <div class="ask" id="ask" hidden>
        <input type="text" id="prompt" placeholder="Ask an assistant…" />
        <button class="icon" id="send" data-tip-at="end"></button>
      </div>

      <!-- Icons and labels for the controls that change (Listen, the toggles) are set by the
           script; the ones that never change carry their label here. -->
      <div class="controls">
        <div class="side">
          <button class="icon" id="type" aria-controls="ask" data-tip-at="start"></button>
          <!-- Disabled until the script has read the tab in front, so there is no window on
               load where it looks pressable and its click handler has no site to act on. -->
          <button class="icon" id="record" disabled data-tip-at="start"
                  aria-label="Reading the tab in front…"></button>
          <!-- Only while this tab is one we may not drive yet: the one thing to do about it. -->
          <button class="icon" id="grant" hidden data-tip-at="start"></button>
        </div>
        <div class="center">
          <button class="icon mic" id="listen"></button>
          <span class="tech" id="shortcut"></span>
        </div>
        <div class="side end">
          <button class="icon" id="settings" aria-label="Settings" data-tip-at="end"></button>
        </div>
      </div>
    </footer>

    <script type="module" src="dist/sidepanel.js"></script>
  </body>
</html>
