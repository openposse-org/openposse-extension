<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenPosse</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 320px; padding: 14px; }
      header {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 12px;
      }
      /* The mark's own sizing lives in `src/mark.js` alongside the artwork, so the popup and
         the orb cannot disagree about it. Only the placeholder needs a rule here: it reserves
         the space before the script fills it, so the header does not jump on open. */
      #mark { width: 22px; height: 22px; flex: 0 0 22px; }
      header .title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.008em; }
      header .spacer { flex: 1; }
      .hint { color: var(--text-faint); font-size: 11px; }
      /* A warning you can act on. It is the only route to the fix, so it has to look
         pressable rather than decorative. */
      .mic-fix {
        display: block; width: 100%; margin-bottom: 11px;
        font: inherit; font-size: 12px; text-align: left; cursor: pointer;
      }
      #agents { margin-bottom: 12px; }
      #empty { color: var(--text-dim); font-size: 12.5px; }

      /* Voice sits above the text box because voice is the product and typing is the
         fallback – the order on screen should say which is which. */
      .listen { display: flex; gap: 9px; align-items: center; }
      .ask { display: flex; gap: 7px; margin-top: 10px; }
      .ask input { flex: 1; }
      footer {
        margin-top: 14px; padding-top: 11px;
        border-top: 1px solid var(--line);
        display: flex; gap: 8px; align-items: center;
      }
      footer .spacer { flex: 1; }
      a { color: var(--text-dim); font-size: 11.5px; text-decoration: none; }
      a:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <header>
      <div id="mark"></div>
      <div class="title">OpenPosse</div>
      <div class="spacer"></div>
      <div class="hint tech" id="shortcut"></div>
    </header>

    <!-- Deliberately not the design's `NOT HEARING ANYTHING – CHECK INPUT` badge. That one is
         for a microphone that is connected and silent, and belongs in the panel's
         not-capturing state. A permission that was never granted needs different words and a
         different action – telling someone to check their input device would send them to
         look for a fault that is not there. -->
    <button id="mic-warning" hidden class="card bad mic-fix"></button>

    <div id="agents"></div>
    <div id="empty" hidden>
      No assistants yet. Open a page with an AI assistant on it, then record it.
    </div>

    <!-- Starts a turn. **Nothing here narrates one** – the orb owns the whole of the current
         turn, and a second surface describing it can only ever be a slower, smaller copy that
         disappears when you look away. The button still says whether it is a Stop, because
         that is the control's own state rather than a report about the turn. -->
    <div class="listen">
      <button id="listen" class="secondary">Listen</button>
    </div>

    <!-- The manual path. Not only a fallback for a dead microphone: it is the whole product
         minus voice, and it is the right answer in a meeting or an open-plan office. -->
    <div class="ask">
      <input type="text" id="prompt" placeholder="Ask Ivan to…" />
      <button id="send">Ask</button>
    </div>

    <!-- E14's surface switch, and it lives here rather than only in the panel because of a
         chicken-and-egg the spike shipped with: the switch was reachable only from the surface
         it switches to, so anyone who could not open the panel could not choose it either.
         Temporary — it goes when the testing resolves and one surface is deleted. -->
    <div class="listen">
      <button id="surface" class="secondary"></button>
    </div>

    <footer>
      <button class="secondary" id="record">Record this tab</button>
      <div class="spacer"></div>
      <a href="#" id="settings">Settings</a>
    </footer>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
