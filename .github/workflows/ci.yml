# Lint, test and build on every push to main and every pull request.
#
# The store zip is built and checked here too, because it is what the Chrome Web Store will be
# sent. A build that passes the tests but packs the manifest key, the spike or the capture tool
# would be refused by the store or would ship developer tools, and nothing else would notice.
#
# Actions are pinned to commits rather than tags, because a tag can be moved to other code.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the run for the older one; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and test
        run: npm test

      - name: Build the development extension
        run: npm run build

      - name: Build the store zip
        run: npm run package

      - name: Check the store zip
        run: bash tools/check-zip.sh "openposse-$(node -p "require('./package.json').version").zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-zip
          path: openposse-*.zip
          retention-days: 14
          if-no-files-found: error
